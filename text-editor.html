<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berry Blade Text</title>
<!-- Berry Blade's game-text editor (2026-11-02). Every string a player reads or hears, from text-catalog.js (made by
     .claude/berry-tools/text_catalog.py). Edit, then EXPORT: a berry-text-changes-<date>.json file (downloaded and copied) for Claude to apply
     with apply_text_changes.py, which also remakes the voice of any spoken line you changed. Drafts stay in this browser until you export. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --y: #ffd203; --s: #2f3b43; --s2: #56646d; --paper: #fbf9f3; --line: #ddd7c8; --soft: #eef0f1; --bad: #c8463a; --ok: #3d8a58; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: var(--s); color: var(--s); font: 16px/1.45 "Jost", "Avenir Next", "Futura", system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .blk { font-family: "Bungee", "Arial Black", sans-serif; background: var(--y); color: var(--s); line-height: 1; padding: 7px 12px 3px; font-size: 22px; white-space: nowrap; display: inline-block; }
  .bar { background: var(--s); color: var(--y); font: 500 11px/1.4 "Jost", sans-serif; letter-spacing: .3em; text-transform: uppercase; padding: 5px 12px; margin-left: 20px; display: inline-block; border: 1px solid rgba(255, 210, 3, .35); border-top: 0; }
  .lockup { display: inline-flex; flex-direction: column; align-items: flex-start; }

  header { position: sticky; top: 0; z-index: 5; background: var(--s); padding: 12px 16px 10px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; border-bottom: 3px solid var(--y); }
  header .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
  .btn { background: var(--y); color: var(--s); border: 0; padding: 8px 12px 6px; font: 15px/1 "Bungee", sans-serif; letter-spacing: .02em; border-radius: 3px; }
  .btn.ghost { background: transparent; color: var(--y); box-shadow: inset 0 0 0 2px var(--y); }
  .btn:focus-visible, .cat:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #search { width: min(260px, 100%); padding: 8px 10px; border: 0; border-radius: 3px; font: inherit; background: #fff; color: var(--s); }
  label.chk { color: #fff; display: inline-flex; gap: 6px; align-items: center; font-weight: 500; font-size: 14px; letter-spacing: .04em; white-space: nowrap; }
  label.chk input { width: 18px; height: 18px; accent-color: var(--y); }
  #stat { color: #cfd6da; font-size: 14px; width: 100%; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  #stat b { color: var(--y); font-weight: 600; }

  .wrap { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 120px); }
  nav { background: var(--s); padding: 12px 10px 40px 16px; position: sticky; top: 118px; align-self: start; max-height: calc(100vh - 118px); overflow: auto; }
  .cat { display: flex; width: 100%; align-items: baseline; gap: 8px; text-align: left; background: transparent; border: 0; color: #fff; padding: 9px 10px 7px; border-radius: 3px; font: 15px/1.15 "Bungee", sans-serif; }
  .cat .n { margin-left: auto; font: 600 13px "Jost", sans-serif; color: #b9c3c8; }
  .cat .c { font: 700 12px "Jost", sans-serif; background: var(--y); color: var(--s); border-radius: 9px; padding: 0 7px; }
  .cat.on { background: var(--y); color: var(--s); }
  .cat.on .n { color: var(--s2); }
  .cat.on .c { background: var(--s); color: var(--y); }
  .cat small { display: block; }
  nav .about { color: #b9c3c8; font-size: 13px; margin: 2px 10px 12px; }

  main { background: var(--paper); padding: 18px 22px 80px; min-width: 0; }
  .note { background: #fff; border: 2px solid var(--line); border-radius: 4px; padding: 10px 14px; margin: 0 0 16px; font-size: 15px; }
  .note.warn { border-color: var(--bad); }
  .note.vo { border-color: var(--y); background: #fffbe3; }
  h2 { font: 26px/1.1 "Bungee", sans-serif; margin: 4px 0 4px; }
  h2 + p { margin: 0 0 14px; color: var(--s2); }
  h3 { font: 600 13px "Jost", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--s2); margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--line); display: flex; gap: 10px; }
  h3 .k { margin-left: auto; letter-spacing: .05em; }
  .ent { background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 3px; padding: 8px 12px 10px; margin: 0 0 8px; }
  .ent.vo { border-left-color: #f0c400; }
  .ent.changed { border-left-color: var(--s); background: #fffbe0; box-shadow: 0 0 0 2px var(--y) inset; }
  .ent.bad { border-left-color: var(--bad); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12.5px; color: var(--s2); margin-bottom: 5px; }
  .meta code { font: 12px ui-monospace, "SF Mono", Menlo, monospace; color: #7a868c; }
  .tag { font: 700 11px/1 "Jost", sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px 3px; border-radius: 2px; background: var(--soft); color: var(--s); }
  .tag.vo { background: var(--y); }
  .tag.rebuild { background: var(--s); color: var(--y); }
  .tag.same { background: transparent; box-shadow: inset 0 0 0 1px var(--line); text-transform: none; letter-spacing: .02em; font-weight: 600; }
  textarea { width: 100%; resize: vertical; border: 1px solid #c9c3b3; border-radius: 3px; padding: 7px 9px; font: 17px/1.4 "Jost", sans-serif; color: var(--s); background: #fff; min-height: 40px; field-sizing: content; }
  .ent.changed textarea { border-color: var(--s); }
  .was { margin-top: 6px; font-size: 14px; color: var(--s2); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .was .old { text-decoration: line-through; text-decoration-color: rgba(47, 59, 67, .45); white-space: pre-wrap; }
  .mini { border: 0; background: var(--s); color: var(--y); font: 12px/1 "Bungee", sans-serif; padding: 6px 9px 4px; border-radius: 2px; }
  .mini.light { background: var(--soft); color: var(--s); }
  .slots { margin-top: 6px; font-size: 13px; color: var(--s2); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .slots button { border: 0; background: var(--soft); border-radius: 2px; padding: 2px 6px; font: 600 13px "Jost", sans-serif; color: var(--s); }
  .slots code { font: 11.5px ui-monospace, Menlo, monospace; }
  .warnline { margin-top: 6px; font-size: 14px; color: var(--bad); font-weight: 600; }
  .hint { font-size: 13px; color: var(--s2); margin-top: 4px; }
  .more { display: block; margin: 16px auto; }
  .empty { color: var(--s2); padding: 30px 0; text-align: center; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 30px); opacity: 0; transition: .25s; background: var(--s); color: #fff; border: 2px solid var(--y); padding: 10px 16px; border-radius: 4px; z-index: 20; max-width: min(560px, calc(100vw - 32px)); font-size: 15px; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #noteBox { width: 100%; min-height: 54px; field-sizing: content; }
  details summary { cursor: pointer; font-weight: 600; }

  @media (max-width: 760px) {
    header { padding: 10px 16px 8px; position: static; }
    .blk { font-size: 18px; }
    header .tools { margin-left: 0; width: 100%; }
    #search { width: 100%; order: -1; }
    .wrap { grid-template-columns: 1fr; }
    nav { position: sticky; top: 0; z-index: 4; max-height: none; display: flex; overflow-x: auto; gap: 6px; padding: 8px 16px; border-bottom: 2px solid var(--y); }
    nav .about { display: none; }
    .cat { width: auto; white-space: nowrap; font-size: 13px; padding: 7px 9px 5px; flex: 0 0 auto; }
    main { padding: 14px 16px 80px; }
    h2 { font-size: 21px; }
    textarea { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="lockup"><div class="blk">BERRY BLADE</div><div class="bar">GAME TEXT</div></div>
  <div class="tools">
    <input id="search" type="search" placeholder="Search the text…" aria-label="Search the text">
    <label class="chk"><input type="checkbox" id="onlyChanged"> CHANGED ONLY</label>
    <button class="btn" id="exportBtn" title="Downloads berry-text-changes-<date>.json and copies it, for Claude">EXPORT CHANGES</button>
    <button class="btn ghost" id="loadBtn" title="Open an exported changes file to keep working on it">LOAD CHANGES FILE</button>
    <button class="btn ghost" id="clearBtn" title="Throw away every unexported edit in this browser">CLEAR</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
  <div id="stat"></div>
</header>
<div class="wrap">
  <nav id="cats" aria-label="Categories"></nav>
  <main id="list"><p class="empty">Loading…</p></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="text-catalog.js"></script>
<script>
(() => {
  const DRAFT_KEY = "berryText.drafts.v1", STALE_KEY = "berryText.stale.v1", NOTE_KEY = "berryText.note.v1", CAT_KEY = "berryText.cat.v1";
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
                  del(k) { try { localStorage.removeItem(k); } catch (e) { } } };
  let toastT = 0;
  const toast = (msg, ms = 3200) => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms); };

  const C = window.BERRY_TEXT;
  if (!C || !C.entries) {
    $("list").innerHTML = `<div class="note warn"><b>No text catalog yet.</b> In Terminal, from the Documents/Claude folder, run:<br><code>python3 .claude/berry-tools/text_catalog.py</code><br>It writes <code>text-catalog.js</code> next to this page; then reload.</div>`;
    return;
  }
  const E = C.entries, byId = new Map(E.map(e => [e.id, e]));
  const CATS = [{ id: "all", name: "Everything", about: "All the game's text in one list (search works best here)" }, ...C.categories];
  const sameText = new Map();                              // text → entries that say it (for "change them all")
  for (const e of E) { const k = e.text; if (!sameText.has(k)) sameText.set(k, []); sameText.get(k).push(e); }

  // ── drafts: { id: { old, new } }, kept in this browser until exported (and after: clear when Claude has applied them) ──
  let drafts = store.get(DRAFT_KEY, {}) || {};
  let stale = store.get(STALE_KEY, []) || [];
  (function reconcile() {                                  // a draft whose original isn't the game's text any more: applied, or the game changed
    let applied = 0, moved = 0;
    for (const id of Object.keys(drafts)) {
      const d = drafts[id], e = byId.get(id);
      if (e && e.text === d.old) continue;
      delete drafts[id];
      if (e && e.text === d.new) { applied++; continue; }
      const twin = E.find(x => x.text === d.old && x.file === d.file && x.owner === d.owner && !drafts[x.id]);   // (its id moved, same words)
      if (twin) { drafts[twin.id] = d; continue; }
      stale.push(d); moved++;
    }
    store.set(DRAFT_KEY, drafts); store.set(STALE_KEY, stale.slice(-200));
    if (applied) setTimeout(() => toast(`${applied} of your edits ${applied === 1 ? "is" : "are"} in the game now: cleared from your drafts.`), 300);
    if (moved) setTimeout(() => toast(`${moved} edit${moved === 1 ? "" : "s"} no longer match the game's text (it changed): set aside, see the note at the top.`, 5000), 3600);
  })();
  const saveDrafts = (() => { let t = 0; return () => { clearTimeout(t); t = setTimeout(() => store.set(DRAFT_KEY, drafts), 250); }; })();
  const cur = e => drafts[e.id] ? drafts[e.id].new : e.text;
  const isChanged = e => !!drafts[e.id] && drafts[e.id].new !== e.text;

  // ── slots: a template's ${...} parts, shown as ⟨1⟩ ⟨2⟩; each must stay, once ──
  const SLOT = /⟨(\d+)⟩/g;
  const slotsOk = (e, t) => { const n = (e.slots || []).length; const got = [...t.matchAll(SLOT)].map(m => +m[1]).sort((a, b) => a - b); return got.length === n && got.every((v, i) => v === i + 1); };
  const slotName = raw => {
    const x = raw.replace(/^\$\{|\}$/g, "").trim();
    const k = x.match(/^keyTag\("(\w+)"\)$/) || x.match(/^kn\("(\w+)"\)$/);
    if (k) return ({ atk: "the attack button", block: "the block button", up: "↑", down: "↓", lr: "← →" })[k[1]] || `the ${k[1]} button`;
    if (/padName|padGlyph|keyName|kb\b/.test(x)) return "a button's name";
    if (/toUpperCase\(\)/.test(x) && /name/i.test(x)) return "a name";
    return x.length > 46 ? x.slice(0, 44) + "…" : x;
  };

  // ── the page ──
  let cat = store.get(CAT_KEY, "vo"); if (!CATS.some(c => c.id === cat)) cat = "vo";
  let query = "", onlyChanged = false, limit = 300;
  const changedCount = id => E.filter(e => (id === "all" || e.cat === id) && isChanged(e)).length;
  function renderStat() {
    const ch = E.filter(isChanged), vo = ch.filter(e => e.vo);
    $("stat").innerHTML = `<span><b>${E.length}</b> strings</span><span><b>${ch.length}</b> changed</span>` + (vo.length ? `<span><b>${vo.length}</b> spoken: voice will be rebuilt</span>` : "") +
      `<span>catalog made ${esc(String(C.generated).replace("T", " "))}</span>`;
  }
  function renderCats() {
    $("cats").innerHTML = CATS.map(c => { const n = c.id === "all" ? E.length : c.count, k = changedCount(c.id);
      return `<button class="cat${c.id === cat ? " on" : ""}" data-cat="${c.id}" title="${esc(c.about || "")}">${esc(c.name)}${k ? `<span class="c">${k}</span>` : ""}<span class="n">${n}</span></button>` +
        (c.id === cat && c.about ? `<div class="about">${esc(c.about)}</div>` : ""); }).join("");
    const nav = $("cats"), on = nav.querySelector(".cat.on");   // (a phone: the strip scrolled to the one picked)
    if (on && nav.scrollWidth > nav.clientWidth + 4) nav.scrollLeft = Math.max(0, on.offsetLeft - 16);
  }
  const matches = e => {
    if (cat !== "all" && e.cat !== cat) return false;
    if (onlyChanged && !isChanged(e)) return false;
    if (!query) return true;
    const q = query.toLowerCase();
    return e.text.toLowerCase().includes(q) || cur(e).toLowerCase().includes(q) || (e.sub || "").toLowerCase().includes(q) || (e.owner || "").toLowerCase().includes(q) || (e.voKey || "").toLowerCase().includes(q);
  };
  function entHtml(e) {
    const t = cur(e), ch = isChanged(e), bad = (e.slots && !slotsOk(e, t)) || !t.trim(), same = sameText.get(e.text).length - 1;
    const tags = [];
    if (e.vo) tags.push(`<span class="tag vo">SPOKEN · ${esc((e.speaker || "Camila").toUpperCase())}</span>`);
    if (e.vo && ch) tags.push(`<span class="tag rebuild">VOICE WILL BE REBUILT</span>`);
    if (same > 0) tags.push(`<span class="tag same" title="The same words are in ${same} other place${same === 1 ? "" : "s"}">same words in ${same} other place${same === 1 ? "" : "s"}</span>`);
    const where = `${esc(e.file)}:${e.line}`, code = [e.owner, e.prop].filter(Boolean).join(".");
    const lead = /^\s/.test(e.text), trail = /\s$/.test(e.text);
    const hints = [];
    if (e.frag) hints.push("A piece of a longer line: the game joins it to other words" + (lead || trail ? `; keep the space at the ${lead && trail ? "start and end" : lead ? "start" : "end"}` : "") + ".");
    else if (lead || trail) hints.push(`Keep the space at the ${lead && trail ? "start and end" : lead ? "start" : "end"}.`);
    if (e.note) hints.push(esc(e.note));
    if (e.vo) hints.push(`Its voice: take <code>${esc(e.clip || "?")}</code> in <code>${esc(e.audio || "")}</code>${e.voNote ? " · " + esc(e.voNote) : ""}. The subtitle shows these words too.`);
    if (e.ambiguous) hints.push("Its place in the code isn't unique: Claude will have to apply this one by hand.");
    return `<div class="ent${e.vo ? " vo" : ""}${ch ? " changed" : ""}${bad ? " bad" : ""}" data-id="${e.id}">
      <div class="meta">${tags.join("")}<span>${where}</span>${code ? `<code>${esc(code)}</code>` : ""}</div>
      <textarea rows="${Math.max(1, Math.ceil(t.length / 72))}" spellcheck="true" aria-label="${esc(e.sub)}: ${esc(e.text.slice(0, 60))}">${esc(t)}</textarea>
      ${e.slots ? `<div class="slots">The game fills in: ${e.slots.map((s, i) => `<button type="button" data-slot="${i + 1}" title="Put it back at the cursor">⟨${i + 1}⟩</button> ${esc(slotName(s))}`).join(" · ")}</div>` : ""}
      <div class="warnline"${bad ? "" : " hidden"}>${!t.trim() ? "Blank: put some words back (or REVERT)." : `Keep each of ${(e.slots || []).map((s, i) => `⟨${i + 1}⟩`).join(" ")} exactly once: the game puts its words there.`}</div>
      <div class="was"${ch ? "" : " hidden"}><span>Was:</span><span class="old">${esc(e.text)}</span><button type="button" class="mini light" data-act="revert">REVERT</button>${same > 0 ? `<button type="button" class="mini" data-act="all" title="Give the ${same} other place${same === 1 ? "" : "s"} with the same words this new text too">SAME CHANGE IN ALL ${same + 1}</button>` : ""}</div>
      ${hints.length ? `<div class="hint">${hints.join(" ")}</div>` : ""}
    </div>`;
  }
  function renderList() {
    const C1 = CATS.find(c => c.id === cat), list = E.filter(matches);
    let h = `<h2>${esc(C1.name)}</h2><p>${esc(C1.about || "")}</p>`;
    if (stale.length) h += `<details class="note warn"><summary>${stale.length} saved edit${stale.length === 1 ? "" : "s"} set aside: the game's own text changed under ${stale.length === 1 ? "it" : "them"}</summary>
      <p>Find the line again (search) and redo it, then clear these.</p><ul>${stale.map(d => `<li><s>${esc(d.old)}</s> → ${esc(d.new)}</li>`).join("")}</ul><button type="button" class="mini" data-act="clearStale">CLEAR THESE</button></details>`;
    if (cat === "vo") h += `<div class="note vo">These lines are spoken by Camila (Kokoro TTS, her narration mix). Change one and Claude remakes its voice with the same recipe when it applies your export; the subtitles use the same words. Keep them short enough to say in one breath.</div>`;
    if (cat === "all" || cat === "vo") h += `<div class="note"><label for="noteBox"><b>A note for Claude</b> (goes in the export, optional):</label><textarea id="noteBox" placeholder="Anything else about these changes…">${esc(store.get(NOTE_KEY, ""))}</textarea></div>`;
    if (!list.length) { $("list").innerHTML = h + `<p class="empty">${onlyChanged ? "Nothing changed here yet." : "Nothing matches."}</p>`; return; }
    let sub = null, shown = 0;
    const groups = new Map();                              // (sub-groups in order of first appearance)
    for (const e of list) { const k = (cat === "all" ? (CATS.find(c => c.id === e.cat) || {}).name + " · " : "") + e.sub; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); }
    for (const [k, items] of groups) {
      if (shown >= limit) break;
      const n = items.filter(isChanged).length;
      h += `<h3><span>${esc(k)}</span><span class="k">${items.length}${n ? ` · ${n} changed` : ""}</span></h3>`;
      for (const e of items) { if (shown++ >= limit) break; h += entHtml(e); }
    }
    if (list.length > limit) h += `<button class="btn more" data-act="more">SHOW MORE (${list.length - limit} LEFT)</button>`;
    $("list").innerHTML = h;
  }
  const renderAll = () => { renderStat(); renderCats(); renderList(); };

  // ── editing ──
  function setText(e, t, el) {
    if (t === e.text) delete drafts[e.id]; else drafts[e.id] = { old: e.text, new: t, file: e.file, owner: e.owner };
    saveDrafts();
    el = el || document.querySelector(`.ent[data-id="${e.id}"]`);
    if (el) {
      const ch = isChanged(e), bad = (e.slots && !slotsOk(e, t)) || !t.trim();
      el.classList.toggle("changed", ch); el.classList.toggle("bad", bad);
      el.querySelector(".was").hidden = !ch;
      const w = el.querySelector(".warnline"); w.hidden = !bad;
      if (bad) w.textContent = !t.trim() ? "Blank: put some words back (or REVERT)." : `Keep each of ${(e.slots || []).map((s, i) => `⟨${i + 1}⟩`).join(" ")} exactly once: the game puts its words there.`;
      const meta = el.querySelector(".meta"), rb = meta.querySelector(".rebuild");
      if (e.vo && ch && !rb) meta.querySelector(".tag.vo").insertAdjacentHTML("afterend", `<span class="tag rebuild">VOICE WILL BE REBUILT</span>`);
      if (rb && !ch) rb.remove();
    }
  }
  const sizeTa = ta => { if (CSS.supports && CSS.supports("field-sizing", "content")) return; ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; };
  let statT = 0;
  $("list").addEventListener("input", ev => {
    const ta = ev.target;
    if (ta.id === "noteBox") { store.set(NOTE_KEY, ta.value); return; }
    const el = ta.closest(".ent"); if (!el) return;
    const e = byId.get(el.dataset.id); setText(e, ta.value, el); sizeTa(ta);
    clearTimeout(statT); statT = setTimeout(() => { renderStat(); renderCats(); }, 200);
  });
  $("list").addEventListener("focusin", ev => { if (ev.target.tagName === "TEXTAREA") sizeTa(ev.target); });
  $("list").addEventListener("keydown", ev => {                // (Enter: on to the next line; shift+Enter for a real line break)
    if (ev.key !== "Enter" || ev.shiftKey || ev.target.tagName !== "TEXTAREA" || ev.target.id === "noteBox") return;
    ev.preventDefault(); const all = [...document.querySelectorAll(".ent textarea")], i = all.indexOf(ev.target); if (all[i + 1]) all[i + 1].focus(); else ev.target.blur();
  });
  $("list").addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.act === "more") { limit += 400; renderList(); return; }
    if (b.dataset.act === "clearStale") { stale = []; store.set(STALE_KEY, []); renderList(); return; }
    const el = b.closest(".ent"); if (!el) return;
    const e = byId.get(el.dataset.id), ta = el.querySelector("textarea");
    if (b.dataset.act === "revert") { ta.value = e.text; setText(e, e.text, el); sizeTa(ta); renderStat(); renderCats(); toast("Back to the game's own text."); return; }
    if (b.dataset.act === "all") {
      const t = cur(e), others = sameText.get(e.text).filter(x => x !== e);
      let n = 0, skipped = 0;
      for (const x of others) { if ((x.slots || []).length !== (e.slots || []).length) { skipped++; continue; } setText(x, t); n++; }
      renderAll(); toast(`Same change in ${n} more place${n === 1 ? "" : "s"}` + (skipped ? ` (${skipped} left alone: different fill-ins)` : "") + "."); return;
    }
    if (b.dataset.slot) {                                   // put a fill-in back at the cursor
      const tag = `⟨${b.dataset.slot}⟩`, s = ta.selectionStart ?? ta.value.length, en = ta.selectionEnd ?? s;
      if (ta.value.includes(tag)) { toast(`${tag} is already in there.`); return; }
      ta.value = ta.value.slice(0, s) + tag + ta.value.slice(en); setText(e, ta.value, el); ta.focus(); ta.selectionStart = ta.selectionEnd = s + tag.length; renderStat(); renderCats();
    }
  });
  $("cats").addEventListener("click", ev => { const b = ev.target.closest(".cat"); if (!b) return; cat = b.dataset.cat; store.set(CAT_KEY, cat); limit = 300; renderCats(); renderList(); window.scrollTo(0, 0); });
  let qT = 0;
  $("search").addEventListener("input", ev => { clearTimeout(qT); qT = setTimeout(() => { query = ev.target.value.trim(); limit = 300; renderList(); }, 160); });
  $("onlyChanged").addEventListener("change", ev => { onlyChanged = ev.target.checked; renderList(); });
  document.addEventListener("keydown", ev => { if (ev.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { ev.preventDefault(); $("search").focus(); } });

  // ── export: a file (downloaded) and the same text on the clipboard ──
  function exportData() {
    const ch = E.filter(isChanged), ok = ch.filter(e => !(e.slots && !slotsOk(e, cur(e))) && cur(e).trim());
    return { left: ch.length - ok.length, data: {
      kind: "berryTextChanges", version: 1, exported: new Date().toISOString(), catalog: C.generated, game: C.root,
      note: store.get(NOTE_KEY, "") || "", count: ok.length, spoken: ok.filter(e => e.vo).length,
      changes: ok.map(e => { const o = { id: e.id, category: e.cat, sub: e.sub, file: e.file, line: e.line, snippet: e.snippet, at: e.at, n: e.n, enc: e.enc, owner: e.owner, prop: e.prop, old: e.text, new: cur(e), vo: !!e.vo };
        if (e.slots) o.slots = e.slots;
        if (e.vo) Object.assign(o, { speaker: e.speaker, voKey: e.voKey, clip: e.clip, audio: e.audio, rebuild: e.rebuild });
        return o; }) } };
  }
  async function copyText(t) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch (e) { }
    try { const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; } catch (e) { return false; }
  }
  $("exportBtn").addEventListener("click", async () => {
    const { data, left } = exportData();
    if (!data.count) { toast(left ? "Fix the lines marked in red first (a missing ⟨n⟩ or blank)." : "Nothing changed yet: edit some text first."); return; }
    const json = JSON.stringify(data, null, 1), d = new Date(), pad = n => String(n).padStart(2, "0");
    const name = `berry-text-changes-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); } catch (e) { }
    const copied = await copyText(json);
    toast(`${name}: ${data.count} change${data.count === 1 ? "" : "s"}` + (data.spoken ? ` (${data.spoken} spoken)` : "") + ` downloaded${copied ? " and copied" : " (copy didn't work here: send Claude the file)"}.` + (left ? ` ${left} left out: fix the red ones.` : ""), 5200);
  });

  // ── load an exported file back in ──
  $("loadBtn").addEventListener("click", () => $("fileIn").click());
  $("fileIn").addEventListener("change", ev => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let o; try { o = JSON.parse(r.result); } catch (e) { toast("That file isn't JSON."); return; }
      if (!o || o.kind !== "berryTextChanges" || !Array.isArray(o.changes)) { toast("That isn't a Berry Blade text changes file."); return; }
      let n = 0, done = 0, lost = [];
      for (const c of o.changes) {
        let e = byId.get(c.id);
        if (!e || e.text !== c.old) e = E.find(x => x.file === c.file && x.text === c.old && x.snippet === c.snippet) || (E.filter(x => x.file === c.file && x.text === c.old && x.owner === c.owner).length === 1 ? E.find(x => x.file === c.file && x.text === c.old && x.owner === c.owner) : null);
        if (e) { setText(e, c.new); n++; continue; }
        if (E.some(x => x.file === c.file && x.text === c.new)) { done++; continue; }
        lost.push({ old: c.old, new: c.new });
      }
      if (lost.length) { stale = stale.concat(lost); store.set(STALE_KEY, stale); }
      if (o.note) store.set(NOTE_KEY, o.note);
      store.set(DRAFT_KEY, drafts); renderAll();
      toast(`Loaded ${n} change${n === 1 ? "" : "s"}` + (done ? `, ${done} already in the game` : "") + (lost.length ? `, ${lost.length} set aside (the game's text changed)` : "") + ".", 5200);
    };
    r.readAsText(f); ev.target.value = "";
  });
  $("clearBtn").addEventListener("click", () => {
    const n = Object.keys(drafts).length; if (!n) { toast("No edits to clear."); return; }
    if (!confirm(`Throw away all ${n} edit${n === 1 ? "" : "s"} in this browser? (Export first if you want to keep them.)`)) return;
    drafts = {}; store.set(DRAFT_KEY, drafts); renderAll(); toast("Cleared.");
  });

  renderAll();
})();
</script>
</body>

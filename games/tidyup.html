<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>

</style></head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/* TIDY UP! (the user, 2026-11-03), a BERRY CONSOLE game: "it's one screen, with a box for shoes, toys, and clothes, and garbage bin. it's a procedurally
   generated room that has the player pickup different items and put them in the right bin pressing one button to grab and the one button to drop in the bin.
   they players have 2 minutes to clean the room. if they get everything, they move to the next room. each room is a different kid's room and everything is
   placed differently. give the room a sort of isometric view where it's mostly overhead but at an angle where the floor is almost rounded like a sort of world
   vibe." Then: "the aesthetics should be drawn like the berry stack game. and have some of the colors that look like scribbles on items to move a little".
   So: Berry Stack's crayon (its fills, ink lines, dot eyes); the room sits on top of a little round world, turned 45° and seen from above at an angle, its floor
   the top of the ball (its edges drop away, and what stands near them leans out); the things to tidy are drawn afresh a few times a second, so their crayon
   strokes boil. ✕ picks a thing up, ✕ by its box puts it in (○ puts it down); a wrong box spits it back out and costs 3 seconds */
const EMB = window.parent !== window;                 // (in the console: its buttons come as messages, which way's held too, and its sound settings)
let MUTE = EMB, FXOFF = EMB, PAUSED = false, HIDDEN = false;
const W = 640, H = 480, PR = 2, DT = 1 / 120;
const cv = document.getElementById('c'), g = cv.getContext('2d');
let SC = 1, OX = 0, OY = 0, DPR = 1;
function fit() { DPR = Math.min(2, window.devicePixelRatio || 1); const w = innerWidth || W, h = innerHeight || H; cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR); cv.style.width = w + 'px'; cv.style.height = h + 'px'; SC = Math.min(w / W, h / H); OX = (w - W * SC) / 2; OY = (h - H * SC) / 2; }
addEventListener('resize', fit); fit();

const PAPER = '#fbf7ee', INK = '#3a3140';
const ROOM_T = 120, PRAD = .065, SPEED = 1.05, ACC = 7.5, GRAB_R = .19, BIN_R = .16, WRONG_T = 3, PER = 10, PER_S = 3, LIFT = .14, BOIL = 7;
const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const backOut = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const approach = (v, to, d) => v < to ? Math.min(to, v + d) : Math.max(to, v - d);
const pick = (L, R = Math.random) => L[Math.floor(R() * L.length)];
const shuffle = (L, R = Math.random) => { for (let i = L.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [L[i], L[j]] = [L[j], L[i]]; } return L; };
function mix(hex, t, to = [255, 251, 242]) { const n = parseInt(hex.slice(1), 16), r = n >> 16, gg = (n >> 8) & 255, b = n & 255; return `rgb(${Math.round(r + (to[0] - r) * t)},${Math.round(gg + (to[1] - gg) * t)},${Math.round(b + (to[2] - b) * t)})`; }
function hexMix(a, b, t) { const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)), A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const dark = (c, t) => hexMix(c, '#2a2230', t), lite = (c, t) => hexMix(c, '#ffffff', t);

// ── crayon (Berry Stack's): a tile of short waxy strokes in one colour over a pale wash of it. Each colour has three tiles (v), so a thing drawn again with the
// next one has its strokes jump about a little, like a hand-drawn cartoon's boil
const TILES = {}, PATS = new WeakMap();
function crayon(x, col, ang = -.9, dens = 1, v = 0) {
  let M = PATS.get(x); if (!M) PATS.set(x, M = {}); const key = col + '|' + ang + '|' + dens + '|' + v; if (M[key]) return M[key];
  let c = TILES[key];
  if (!c) { const S = 128; c = TILES[key] = document.createElement('canvas'); c.width = c.height = S; const t = c.getContext('2d'), Rn = rng(hashStr(key));
    t.lineCap = 'round'; t.strokeStyle = col;
    for (let i = 0, n = Math.round(240 * dens); i < n; i++) {
      const px = Rn() * S, py = Rn() * S, L = 6 + Rn() * 16, a = ang + (Rn() - .5) * .45, dx = Math.cos(a) * L / 2, dy = Math.sin(a) * L / 2;
      t.globalAlpha = .28 + Rn() * .6; t.lineWidth = 1.3 + Rn() * 2.6;
      for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) { t.beginPath(); t.moveTo(px - dx + ox, py - dy + oy); t.lineTo(px + dx + ox, py + dy + oy); t.stroke(); }
    } }
  return M[key] = x.createPattern(c, 'repeat');
}
function cfill(x, col, o = {}) { x.fillStyle = mix(col, o.light ?? .55); x.fill(); x.fillStyle = crayon(x, col, o.ang ?? -.9, o.dens ?? 1, o.v || 0); x.fill(); }
function pen(x, w = 2, a = .85, col = INK) { x.save(); x.lineJoin = x.lineCap = 'round'; x.strokeStyle = col; x.lineWidth = w; x.globalAlpha *= a; x.stroke(); x.restore(); }
function rrect(x, x0, y0, w, h, r) { x.beginPath(); x.moveTo(x0 + r, y0); x.arcTo(x0 + w, y0, x0 + w, y0 + h, r); x.arcTo(x0 + w, y0 + h, x0, y0 + h, r); x.arcTo(x0, y0 + h, x0, y0, r); x.arcTo(x0, y0, x0 + w, y0, r); x.closePath(); }
function circ(x, cx, cy, r) { x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); }
function ell(x, cx, cy, rx, ry, rot = 0) { x.beginPath(); x.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); }
function star(x, cx, cy, r, k = .45) { x.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * k : r, a = i * Math.PI / 5 - Math.PI / 2; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } x.closePath(); }
function heart(x, cx, cy, r) { x.beginPath(); x.moveTo(cx, cy + r); x.bezierCurveTo(cx - r * 1.6, cy - r * .2, cx - r * .8, cy - r * 1.4, cx, cy - r * .5); x.bezierCurveTo(cx + r * .8, cy - r * 1.4, cx + r * 1.6, cy - r * .2, cx, cy + r); x.closePath(); }
const FONT = s => `${s}px Bungee, "Arial Black", system-ui, sans-serif`, SANS = (s, w = 700) => `${w} ${s}px Jost, system-ui, sans-serif`;
let BV = 0;                                           // (which of its three crayon tiles a thing's drawn with just now: the boil. 0 for the still parts)
const cf = (x, col, o = {}) => cfill(x, col, { light: .38, ...o, v: BV });
const ink = (x, w = 1.6, a = .9, col = INK) => pen(x, w, a, col);
const dot = (x, px, py, r = 1.4, col = INK) => { circ(x, px, py, r); x.fillStyle = col; x.fill(); };
function scribble(x, x0, x1, y0, y1, col, n, seed, w = 2, a = .5) {   // loose loops of crayon (Berry Stack's ground)
  const Rn = rng(seed); x.save(); x.strokeStyle = col; x.lineWidth = w; x.globalAlpha = a; x.lineCap = x.lineJoin = 'round';
  for (let k = 0; k < n; k++) { let px = x0 + Rn() * (x1 - x0), py = y0 + Rn() * (y1 - y0); x.beginPath(); x.moveTo(px, py);
    for (let i = 0; i < 6; i++) { px += 10 + Rn() * 18; const qy = py + (Rn() - .5) * (y1 - y0) * .3; x.quadraticCurveTo(px - 8, qy - 9, px, py + (Rn() - .5) * 6); } x.stroke(); }
  x.restore();
}

// ── the little world: a room's floor is X, Y from -1 to 1 (its back walls on X = -1 and Y = -1), laid over the top of a ball RS across, turned 45° and seen
// from above at TILT. Heights go out along the ball's own up, so the edges drop away and draw in, and what stands near them leans out
const CX = 320, CY = 222, K = 166, TILT = .66, CT = Math.cos(TILT), ST = Math.sin(TILT), RS = 2.3, WALL_H = .5, WALL_T = .07;
function P3(X, Y, h = 0) {
  const r = Math.hypot(X, Y), a = r / RS, k = r > 1e-6 ? Math.sin(a) / r : 1 / RS, R2 = RS + h;
  const x = X * k * R2, y = Y * k * R2, z = Math.cos(a) * R2 - RS, xr = (x - y) * Math.SQRT1_2, yr = (x + y) * Math.SQRT1_2;
  return [CX + xr * K, CY + (yr * CT - z * ST) * K];
}
function unP(sx, sy) { let X = 0, Y = 0; for (let i = 0; i < 16; i++) { const [px, py] = P3(X, Y), a = (sx - px) / K, b = (sy - py) / (K * CT); X += (a + b) * Math.SQRT1_2; Y += (b - a) * Math.SQRT1_2; } return [X, Y]; }   // (the floor under a point of the stage)
function lean(X, Y) { const A = P3(X, Y, 0), B = P3(X, Y, .1); return Math.atan2(B[0] - A[0], A[1] - B[1]); }   // (how far what stands there tips over, on the stage)
function seg(a, b, n = 6) { const o = []; for (let i = 0; i < n; i++) { const t = i / n; o.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2] || 0, b[2] || 0, t)]); } return o; }
const ring = (...C) => C.flatMap((c, i) => seg(c, C[(i + 1) % C.length]));
function path3(x, pts, close = true) { x.beginPath(); pts.forEach((p, i) => { const [sx, sy] = P3(p[0], p[1], p[2] || 0); i ? x.lineTo(sx, sy) : x.moveTo(sx, sy); }); if (close) x.closePath(); }
function onPlane(x, o, u, v, draw) {                  // drawing flat on a surface of the room: o its corner [X, Y, h], u its across (to the right) and v its down; 1 px of it = 1/K
  const e = .02, A = P3(o[0], o[1], o[2]), B = P3(o[0] + u[0] * e, o[1] + u[1] * e, o[2] + u[2] * e), C = P3(o[0] + v[0] * e, o[1] + v[1] * e, o[2] + v[2] * e), s = 1 / (e * K);
  x.save(); x.transform((B[0] - A[0]) * s, (B[1] - A[1]) * s, (C[0] - A[0]) * s, (C[1] - A[1]) * s, A[0], A[1]); draw(x); x.restore();
}
const wallO = (w, s, h) => w === 'A' ? [-1, -s, h] : [s, -1, h], wallU = w => w === 'A' ? [0, -1, 0] : [1, 0, 0];   // (along a wall, left to right on the stage: s from -1 to 1)
const distBox = (b, X, Y) => Math.hypot(Math.max(b.x0 - X, 0, X - b.x1), Math.max(b.y0 - Y, 0, Y - b.y1));
function box(x, b, col, o = {}) {                     // a box standing in the room: its two sides toward you and its top, in crayon, inked
  const { x0, y0, x1, y1 } = b, h0 = b.h0 || 0, h1 = b.h1, L = o.light ?? .42;
  path3(x, ring([x0, y1, h0], [x1, y1, h0], [x1, y1, h1], [x0, y1, h1])); cfill(x, dark(col, .1), { light: L, ang: -.9 }); pen(x, 1.5, .85);
  path3(x, ring([x1, y1, h0], [x1, y0, h0], [x1, y0, h1], [x1, y1, h1])); cfill(x, dark(col, .24), { light: L, ang: .7 }); pen(x, 1.5, .85);
  if (!o.open) { path3(x, ring([x0, y0, h1], [x1, y0, h1], [x1, y1, h1], [x0, y1, h1])); cfill(x, lite(col, .08), { light: L + .1, ang: -.4 }); pen(x, 1.5, .85); }
}
function cyl(x, X, Y, r, h0, h1, col, o = {}) {       // a round thing standing on the floor: its side, then its top (o.open: a hole in it)
  const B = P3(X, Y, h0), T2 = P3(X, Y, h1), rx = r * K, ry = r * K * CT;
  x.beginPath(); x.moveTo(T2[0] - rx, T2[1]); x.lineTo(B[0] - rx, B[1]); x.ellipse(B[0], B[1], rx, ry, 0, Math.PI, 0, true); x.lineTo(T2[0] + rx, T2[1]); x.ellipse(T2[0], T2[1], rx, ry, 0, 0, Math.PI, true); x.closePath();
  cfill(x, dark(col, .12), { light: o.light ?? .42, ang: 1.2 }); pen(x, 1.5, .85);
  ell(x, T2[0], T2[1], rx, ry); cfill(x, lite(col, .1), { light: .5 }); pen(x, 1.5, .85);
  if (o.open) { ell(x, T2[0], T2[1] + ry * .06, rx * .8, ry * .72); x.fillStyle = dark(col, .55); x.fill(); x.save(); ell(x, T2[0], T2[1] + ry * .06, rx * .8, ry * .72); x.clip(); ell(x, T2[0], T2[1] - ry * .55, rx * .82, ry * .7); x.fillStyle = dark(col, .32); x.fill(); x.restore(); ell(x, T2[0], T2[1] + ry * .06, rx * .8, ry * .72); pen(x, 1.1, .7); }
  return [T2, rx, ry];
}

// ── the kids whose rooms they are: each its own wallpaper, bed, rug and floor, and the little world under it
const KIDS = [
  { n: 'LUNA', wall: '#f7bfd4', trim: '#d9739c', motif: 'heart', mc: '#e85d93', poster: 'rainbow', bed: '#f06aa8', rug: '#b48be8', rug2: '#fff3c4', floor: 'wood', wood: '#e0b27a', planet: '#c9b6f0', sky: '#d9e8fb' },
  { n: 'MILO', wall: '#4a5f8f', trim: '#2c3c64', motif: 'star', mc: '#f5c542', poster: 'rocket', bed: '#5aa9e6', rug: '#f5b631', rug2: '#4a5f8f', floor: 'carpet', carpet: '#8fb4d9', wood: '#c9925a', planet: '#9fc7ef', sky: '#e7e2fb', dim: 1 },
  { n: 'OSCAR', wall: '#c4e6a8', trim: '#6aa84f', motif: 'paw', mc: '#79b356', poster: 'dino', bed: '#6cbf5c', rug: '#f39a4a', rug2: '#fff3c4', floor: 'wood', wood: '#d19c62', planet: '#f7c98f', sky: '#fff0d6' },
  { n: 'PIA', wall: '#ffe39a', trim: '#e0a93a', motif: 'flower', mc: '#f08a4b', poster: 'sun', bed: '#ff9b54', rug: '#2fb8a8', rug2: '#fffaf0', floor: 'carpet', carpet: '#f1c4a2', wood: '#caa06e', planet: '#b9e6a0', sky: '#e3f4fb' },
  { n: 'TEO', wall: '#b3def2', trim: '#3a8fd6', motif: 'stripe', mc: '#e6f5fc', poster: 'ball', bed: '#3a8fd6', rug: '#6cbf5c', rug2: '#fffaf0', floor: 'wood', wood: '#b9875a', planet: '#a9e0c9', sky: '#fdebd7' },
  { n: 'ROSA', wall: '#dcc6f2', trim: '#8a63c4', motif: 'berry', mc: '#9a6bd6', poster: 'berry', bed: '#9a6bd6', rug: '#f06aa8', rug2: '#fff3c4', floor: 'wood', wood: '#e3b98a', planet: '#f6b8d2', sky: '#e9f6e4' },
  { n: 'NICO', wall: '#d3dde2', trim: '#6d8794', motif: 'bolt', mc: '#f5b631', poster: 'robot', bed: '#f5b631', rug: '#ef6a4c', rug2: '#fffaf0', floor: 'carpet', carpet: '#a7b6bd', wood: '#a7835e', planet: '#ffd58a', sky: '#e5ecfb' },
  { n: 'IVY', wall: '#bdeee5', trim: '#2fa596', motif: 'wave', mc: '#4fb8d8', poster: 'fish', bed: '#2fb8a8', rug: '#ff8f7a', rug2: '#fffaf0', floor: 'wood', wood: '#dcae7c', planet: '#a8d8f5', sky: '#fff2e0' },
];

// ── what's lying about, and the four boxes it goes in
const CAT_IDS = ['shoes', 'toys', 'clothes', 'trash'];
const CAT = {
  shoes: { n: 'SHOES', not: "THAT'S NOT A SHOE!", c: '#3f8fd0', sign: 'sneaker', bin: 'shoebox' },
  toys: { n: 'TOYS', not: "THAT'S NOT A TOY!", c: '#d63d7c', sign: 'teddy', bin: 'chest' },
  clothes: { n: 'CLOTHES', not: "THOSE AREN'T CLOTHES!", c: '#7b52c4', sign: 'shirt', bin: 'basket' },
  trash: { n: 'TRASH', not: "THAT'S NOT TRASH!", c: '#4f9a3c', sign: 'peel', bin: 'can' } };
const SIGN_COL = { shoes: { a: '#5aa9e6' }, toys: { a: '#c68a52' }, clothes: { a: '#9a6bd6', b: '#fff3c4' }, trash: { a: '#f5c542' } };
const KINDS = { shoes: ['sneaker', 'boot', 'slipper'], toys: ['teddy', 'ball', 'car', 'block', 'duck'], clothes: ['shirt', 'socks', 'pants', 'cap', 'dress'], trash: ['peel', 'paper', 'soda', 'core', 'juice'] };
const BRIGHT = ['#ef6a4c', '#5aa9e6', '#f5c542', '#6cbf5c', '#f06aa8', '#9a6bd6', '#2fb8a8', '#ff9b54'];
const ITEM_COL = { sneaker: BRIGHT, boot: ['#f5c542', '#ef6a4c', '#6cbf5c', '#5aa9e6'], slipper: ['#f7c6da', '#d9c2f0', '#bfe3f5', '#fff0b3'], teddy: ['#c68a52', '#e0b77c', '#9c6b44', '#f2a7c3'],
  ball: BRIGHT, car: ['#ef6a4c', '#5aa9e6', '#f5c542', '#6cbf5c', '#9a6bd6'], block: BRIGHT, duck: ['#f5c542'], shirt: BRIGHT, socks: BRIGHT, pants: ['#5b84c4', '#3f6aa8', '#8a6bd6', '#6cbf5c', '#ef6a4c'],
  cap: BRIGHT, dress: BRIGHT, peel: ['#f5c542'], paper: ['#f4f1ea'], soda: ['#ef4c4c', '#2fb8a8', '#f5b631', '#5aa9e6'], core: ['#ef4c4c', '#9ccb5a'], juice: ['#ff9b54', '#9a6bd6', '#6cbf5c'] };
const BIN_H = { shoebox: .13, chest: .2, basket: .19, can: .25 };

// each one drawn standing up on its spot (0, 0), about 30 px, in crayon with ink round it (c.a its colour, c.b a second)
const DRAW = {
  sneaker(x, c) {
    x.beginPath(); x.moveTo(-13, -5); x.lineTo(-12, -15); x.quadraticCurveTo(-11, -18, -6, -18); x.lineTo(-2, -17.5); x.quadraticCurveTo(3, -12, 9, -11); x.quadraticCurveTo(15, -10, 15, -5); x.closePath(); cf(x, c.a); ink(x);
    rrect(x, -15, -6, 31, 6, 3); cf(x, '#f4efe6', { light: .2 }); ink(x);
    for (let i = 0; i < 3; i++) { x.beginPath(); x.moveTo(-4 + i * 3.4, -15.6 + i * 1.5); x.lineTo(-.5 + i * 3.4, -13 + i * 1.5); ink(x, 1.3, .8); }
    x.beginPath(); x.moveTo(-12.5, -10.5); x.lineTo(-7.5, -10.5); ink(x, 1.1, .5);
  },
  boot(x, c) {
    x.beginPath(); x.moveTo(-8, 0); x.lineTo(-8, -25); x.lineTo(4, -25); x.lineTo(4, -10); x.quadraticCurveTo(13, -10, 14, -4); x.lineTo(14, 0); x.closePath(); cf(x, c.a); ink(x);
    rrect(x, -9.5, -28, 15, 5, 2); cf(x, lite(c.a, .35)); ink(x);
    x.beginPath(); x.moveTo(-7.5, -2); x.lineTo(13.5, -2); ink(x, 2.2, .7, dark(c.a, .45));
  },
  slipper(x, c) {
    [-4, 4].forEach(ex => { ell(x, ex + 2, -15, 2.8, 6.5, ex * .07); cf(x, c.a); ink(x, 1.3); ell(x, ex + 2, -14.5, 1.2, 4, ex * .07); x.fillStyle = '#f39ab9'; x.fill(); });
    ell(x, 0, -6, 15, 6.5); cf(x, c.a, { light: .25 }); ink(x);
    dot(x, 7.5, -8); dot(x, 11, -8); circ(x, 13.3, -5.6, 1.6); x.fillStyle = '#f39ab9'; x.fill();
  },
  teddy(x, c) {
    [-7, 7].forEach(ex => { circ(x, ex, -30.5, 3.6); cf(x, c.a); ink(x, 1.3); circ(x, ex, -30.5, 1.6); x.fillStyle = lite(c.a, .5); x.fill(); });
    [-11, 11].forEach(ax => { ell(x, ax, -13, 3.2, 5, ax * .03); cf(x, c.a); ink(x, 1.3); });
    [-8.5, 8.5].forEach(lx => { ell(x, lx, -3.6, 4.6, 3.6); cf(x, c.a); ink(x, 1.3); });
    ell(x, 0, -10, 9.5, 9); cf(x, c.a); ink(x);
    ell(x, 0, -9.5, 5, 5); cf(x, lite(c.a, .5), { light: .3 });
    circ(x, 0, -24, 8.5); cf(x, c.a); ink(x);
    ell(x, 0, -21, 4, 3); cf(x, lite(c.a, .55), { light: .3 }); ink(x, 1, .6);
    dot(x, -3.2, -26); dot(x, 3.2, -26); dot(x, 0, -22, 1.5);

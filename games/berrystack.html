const PG = 462, WAIT_X = 580, GRAB_X = TRAY_X + 58;

const KINDS = [{ c: '#5aa9e6', d: '#2c6aa3', w: 3, n: 'BLUE' }, { c: '#9a6bd6', d: '#5c3a93', w: 2, n: 'GRAPE' }, { c: '#f06aa8', d: '#ad346c', w: 2, n: 'PINK' }, { c: '#f5b631', d: '#b77a12', w: 2, n: 'GOLD' }];   // four colours (the user, 2026-11-02: "have 4 colors of berries"): blueberries the most (the user's drawn berry), then grape, raspberry pink and a golden one
// the points (the user, 2026-11-02: "players get bonus points for lining up two or more of the same color. the score will be about 100 points for each stack, and then
// bonus for continued streak of not dropping, for colors matching, and speed points at the end"): 100 a stack; a run of one colour in it 50 for two, 150 for three, 400 for
// all four (two pairs, 100); a stack in a row with none dropped 10 more than the last (up to 100); and how quick each stack went up, added up and paid at the end
const PTS = 100, MATCH = [0, 0, 50, 150, 400], STREAK_UP = 10, STREAK_MAX = 100, PAR = 6, PER_S = 12, SPEED_MAX = 50;
const CATS = [{ b: '#f3a24c', d: '#c66f22', stripe: 1 }, { b: '#a3a9b3', d: '#6c7380', stripe: 1 }, { b: '#45414b', d: '#26232b', dark: 1 }, { b: '#f6f0e6', d: '#e09a52', patch: 1 }];
const DOGS = [{ b: '#e3b56d', d: '#b9863e' }, { b: '#9c6b44', d: '#6b4426' }, { b: '#f4efe6', d: '#5b4b3f', spots: 1 }, { b: '#403a38', d: '#221e1d', chest: 1, dark: 1 }];

const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };

// ── crayon: a tile of short waxy strokes in one colour, laid over a pale wash of it, so fills look coloured in by hand like the drawings
const PATS = new WeakMap();
function crayon(x, col, ang = -.9, dens = 1) {

  f.beginPath(); f.moveTo(GX0 + 30, GY0); f.lineTo(GX0 + 70, GY0); f.lineTo(GX0 - 10, GY1); f.lineTo(GX0 - 50, GY1); f.fill();

// ── state
let state = 'title', T = 0, timeLeft = GAME_T, stacks = 0, best = 0, overT = 0, lastTick = 99, startT = 0, score = 0, streak = 0, speedPts = 0, stackT0 = -1, stackT = 0, newBest = false, best0 = 0;
try { best = +localStorage.getItem('berryStackBestScore') || 0; } catch (e) { }   // (the best score now; the old best count of stacks, berryStackBest, left be)
const claw = { x: PLATE_X - 60, vx: 0, dir: 1, phi: 0, dphi: 0, L: LB, mode: 'hold', t: 0, open: 0, berry: pickKind() };
let stack = [], flying = [], parts = [], pops = [], pets = [], skewer = null, kebab = null, trayPlate = null, petWait = 0;
const sway = { th: 0, w: 0 }, plate = { up: 1 };
const SUP = R * .6, TIP = .34, SPEED_UP = 32;          // the base's footing (how far its weight can lean off the bottom berry) · past this lean it's going over · the claw's step up per delivery
let settle = 0;                                       // (the fourth one on: a beat to see that it stands before the skewer comes)
let door = 0, doorTo = 0;
const clawSpeed = () => state === 'title' ? 120 : Math.min(600, 170 + 12 * stack.length + SPEED_UP * stacks);   // (quicker with every delivery: the user, 2026-11-02; then "make the increasing speed faster from skewer to skewer": 20 → 32 a delivery, the cap 470 → 600)
const plateReady = () => plate.up >= 1 && !skewer;
const stepNow = () => skewer ? lerp(STEP, KSTEP, skewer.spread || 0) : STEP;

function clawBerry() { return { x: claw.x + Math.sin(claw.phi) * claw.L, y: RAIL_Y + Math.cos(claw.phi) * claw.L }; }

// ── sound: little made-up blips (the console says whether effects are on)
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume().catch(() => { }); return AC; }
function tone(f0, f1, dur, type = 'sine', vol = .15, delay = 0) {

  v.gain.setValueAtTime(.0001, t); v.gain.exponentialRampToValueAtTime(vol, t + .012); v.gain.exponentialRampToValueAtTime(.0001, t + dur);
